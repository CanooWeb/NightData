<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NightData</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #05050a 0%, #0a0d18 45%, #101426 75%, #161a2e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(1px 1px at 20% 15%, rgba(255,255,255,0.9), transparent 60%),
        radial-gradient(1px 1px at 35% 8%, rgba(255,255,255,0.6), transparent 60%),
        radial-gradient(1.5px 1.5px at 50% 18%, rgba(255,255,255,0.8), transparent 60%),
        radial-gradient(1px 1px at 65% 12%, rgba(255,255,255,0.7), transparent 60%),
        radial-gradient(1px 1px at 78% 22%, rgba(255,255,255,0.5), transparent 60%),
        radial-gradient(1.5px 1.5px at 88% 9%, rgba(255,255,255,0.9), transparent 60%),
        radial-gradient(1px 1px at 12% 30%, rgba(255,255,255,0.6), transparent 60%),
        radial-gradient(1px 1px at 45% 35%, rgba(255,255,255,0.5), transparent 60%),
        radial-gradient(1.5px 1.5px at 72% 33%, rgba(255,255,255,0.8), transparent 60%),
        radial-gradient(1px 1px at 58% 26%, rgba(255,255,255,0.6), transparent 60%),
        radial-gradient(1px 1px at 30% 40%, rgba(255,255,255,0.45), transparent 60%),
        radial-gradient(1px 1px at 90% 42%, rgba(255,255,255,0.55), transparent 60%);
      animation: twinkle 6s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .moon {
      position: absolute;
      top: 9%;
      right: 14%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fdf6e3, #f5e6b8 55%, #d9c48a);
      box-shadow: 0 0 60px 20px rgba(245, 230, 184, 0.15);
      z-index: 0;
    }

    .cloud {
      position: absolute;
      z-index: 1;
      background: radial-gradient(ellipse at 30% 30%, #0b0e18 0%, #070910 55%, rgba(7, 9, 16, 0) 75%);
      border-radius: 50%;
      animation: drift linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 35% 40%, #0b0e18 0%, #070910 55%, rgba(7, 9, 16, 0) 75%);
    }

    .cloud::before {
      width: 55%;
      height: 110%;
      top: -40%;
      left: 15%;
    }

    .cloud::after {
      width: 70%;
      height: 90%;
      top: -25%;
      left: 38%;
    }

    .cloud.c1 { width: 460px; height: 130px; top: 8%;  left: -100px;  animation-duration: 95s; opacity: 0.85; }
    .cloud.c2 { width: 380px; height: 110px; top: 26%; right: -80px;  animation-duration: 125s; animation-delay: -45s; opacity: 0.7; }
    .cloud.c3 { width: 560px; height: 150px; top: 40%; left: -160px;  animation-duration: 145s; animation-delay: -75s; opacity: 0.65; }
    .cloud.c4 { width: 420px; height: 120px; top: 62%; right: -120px; animation-duration: 115s; animation-delay: -25s; opacity: 0.75; }
    .cloud.c5 { width: 300px; height: 100px; top: 84%; left: 20%;    animation-duration: 155s; animation-delay: -95s; opacity: 0.55; }

    @keyframes drift {
      from { transform: translateX(-130px); }
      to   { transform: translateX(calc(100vw + 130px)); }
    }

    .city {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48vh;
      z-index: 0;
    }

    .building {
      position: absolute;
      bottom: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0%, transparent 6%, transparent 86%, rgba(0, 0, 0, 0.45) 94%, rgba(0, 0, 0, 0.7) 100%),
        linear-gradient(180deg, var(--top, #1b2440) 0%, var(--mid, #0e1426) 55%, #070a12 100%);
      box-shadow: -2px 0 20px rgba(0, 0, 0, 0.5), 2px 0 20px rgba(0, 0, 0, 0.35);
    }

    .building::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent 0 12px, rgba(0, 0, 0, 0.6) 12px 14px),
        repeating-linear-gradient(90deg, transparent 0 20px, rgba(0, 0, 0, 0.55) 20px 21px, transparent 21px 23px),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, 0.6) 3px 4px, transparent 4px 12px),
        repeating-linear-gradient(90deg, transparent 0 7px, rgba(0, 0, 0, 0.55) 7px 8px, transparent 8px 20px),
        repeating-linear-gradient(0deg, rgba(16, 24, 42, 0.95) 0 7px, transparent 7px 12px),
        repeating-linear-gradient(90deg, transparent 0 3px, rgba(16, 24, 42, 0.95) 3px 7px, transparent 7px 20px),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 1px, rgba(255, 190, 120, 0) 1px 3px, rgba(255, 190, 120, 0.8) 3px 6px, rgba(0, 0, 0, 0) 6px 12px),
        repeating-linear-gradient(90deg, rgba(255, 190, 120, 0.8) 0 4px, transparent 4px 20px),
        repeating-linear-gradient(0deg, rgba(150, 200, 255, 0) 0 4px, rgba(150, 200, 255, 0.6) 4px 6px, rgba(0, 0, 0, 0) 6px 12px),
        repeating-linear-gradient(90deg, transparent 0 12px, rgba(150, 200, 255, 0.6) 12px 15px, transparent 15px 20px);
      background-position:
        var(--px, 0) var(--py, 0), var(--px, 0) var(--py, 0), var(--px, 0) var(--py, 0),
        var(--px, 0) var(--py, 0), var(--px, 0) var(--py, 0), var(--px, 0) var(--py, 0),
        var(--px, 0) var(--py, 0), var(--px, 0) var(--py, 0), var(--px, 0) var(--py, 0),
        var(--px, 0) var(--py, 0);
    }

    .building::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 6%;
      right: 6%;
      height: 6px;
      background: linear-gradient(180deg, #2a3552, #0d1220);
      border-radius: 1px;
      box-shadow:
        14px -12px 0 2px #121828,
        14px -12px 0 0 #0a0e19,
        52px -18px 0 4px #11172a,
        52px -18px 0 -2px #0a0e19,
        86px -9px 0 3px #141a2c,
        86px -9px 0 -1px #0a0e19;
    }

    .b1  { left: 1%;  width: 6%;  height: 42%;  --top: #1c2740; }
    .b2  { left: 7%;  width: 5%;  height: 68%;  --top: #222e4e; --py: 5px; }
    .b3  { left: 12%; width: 8%;  height: 30%;  --top: #1a2440; --py: 9px; }
    .b4  { left: 20%; width: 7%;  height: 58%;  --top: #1f2a48; --py: 2px; }
    .b5  { left: 27%; width: 9%;  height: 82%;  --top: #263252; --py: 7px; }
    .b6  { left: 36%; width: 5%;  height: 38%;  --top: #182138; --py: 11px; }
    .b7  { left: 41%; width: 8%;  height: 70%;  --top: #202b4c; --py: 4px; }
    .b8  { left: 49%; width: 6%;  height: 30%;  --top: #19233c; --py: 8px; }
    .b9  { left: 55%; width: 8%;  height: 64%;  --top: #233050; --py: 3px; }
    .b10 { left: 63%; width: 5%;  height: 88%;  --top: #283658; --py: 10px; }
    .b11 { left: 68%; width: 10%; height: 100%; --top: #2c3a60; --py: 6px; }
    .b12 { left: 78%; width: 7%;  height: 56%;  --top: #1c2740; --py: 12px; }
    .b13 { left: 85%; width: 8%;  height: 34%;  --top: #1a2440; --py: 5px; }
    .b14 { left: 93%; width: 7%;  height: 74%;  --top: #222e4e; --py: 2px; }

    .antenna {
      position: absolute;
      bottom: 100%;
      left: 50%;
      width: 2px;
      height: 34px;
      background: #0c101d;
      transform: translateX(-50%);
      z-index: 1;
    }

    .antenna::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ff4d6d;
      box-shadow: 0 0 8px 2px rgba(255, 77, 109, 0.8);
      animation: blink 2s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(90deg, #ffd166 0%, #ff9e5e 25%, #ff4d6d 50%, #7ae0e0 75%, #ffd166 100%);
      opacity: 0.35;
      filter: blur(0.5px);
      z-index: 0;
    }

    .fog {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22vh;
      background: linear-gradient(180deg, rgba(5, 6, 10, 0) 0%, rgba(5, 6, 10, 0.6) 70%, rgba(5, 6, 10, 0.9) 100%);
      z-index: 0;
    }

    .card {
      background: rgba(23, 25, 35, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 400px;
      padding: 40px 36px;
      z-index: 2;
      position: relative;
    }

    .card h1 {
      text-align: center;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #6a2bd6;
      font-size: 30px;
      margin-bottom: 8px;
      text-shadow:
        0 0 6px rgba(0, 0, 0, 0.95),
        0 0 18px rgba(0, 0, 0, 0.85),
        0 0 36px rgba(0, 0, 0, 0.75),
        0 0 70px rgba(0, 0, 0, 0.6),
        0 0 4px rgba(139, 63, 240, 0.35);
    }

    .subtitle {
      text-align: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      letter-spacing: 3px;
      color: #6a3bb8;
      margin-bottom: 22px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      animation: glitch 4s steps(2, start) infinite;
    }

    @keyframes glitch {
      0%, 92%, 100% { text-shadow: 0 0 10px rgba(0, 0, 0, 0.9); }
      93% { text-shadow: 2px 0 0 #ff4d6d, -2px 0 0 #7ae0e0, 0 0 10px rgba(0, 0, 0, 0.9); }
      95% { text-shadow: -2px 0 0 #ff4d6d, 2px 0 0 #7ae0e0, 0 0 10px rgba(0, 0, 0, 0.9); }
    }

    .divider {
      position: relative;
      height: 1px;
      margin: 0 4px 24px;
      background: linear-gradient(90deg, transparent, rgba(139, 63, 240, 0.7), transparent);
      box-shadow: 0 0 10px rgba(139, 63, 240, 0.4);
    }

    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(139, 63, 240, 0.85);
      z-index: 3;
      pointer-events: none;
      transition: width 0.3s, height 0.3s;
    }

    .card::before {
      top: 8px;
      left: 8px;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 8px;
    }

    .card::after {
      bottom: 8px;
      right: 8px;
      border-left: none;
      border-top: none;
      border-bottom-right-radius: 8px;
    }

    .card:hover::before,
    .card:hover::after {
      width: 26px;
      height: 26px;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.22) 0px,
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 3px
      );
      mix-blend-mode: multiply;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.75) 100%);
    }

    .tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 2px solid #2a2d3a;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6a3bb8;
      cursor: pointer;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .tabs button:hover {
      color: #8e5af0;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .tabs button.active {
      color: #8b3ff0;
      border-bottom: 3px solid #8b3ff0;
      margin-bottom: -2px;
      text-shadow:
        0 0 6px rgba(0, 0, 0, 0.95),
        0 0 16px rgba(0, 0, 0, 0.85),
        0 0 30px rgba(0, 0, 0, 0.7);
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: #9a6fd8;
      margin-bottom: 6px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Share Tech Mono', monospace;
      color: #b18bf0;
      background: rgba(10, 11, 16, 0.7);
      transition: border-color 0.3s;
    }

    .form-group input::placeholder {
      color: #4b3d66;
      opacity: 1;
    }

    .form-group input:focus {
      outline: none;
      border-color: #8b3ff0;
      box-shadow: 0 0 0 1px rgba(139, 63, 240, 0.4), 0 0 16px rgba(139, 63, 240, 0.25), inset 0 0 8px rgba(139, 63, 240, 0.1);
    }

    .form-group input::selection {
      background: rgba(139, 63, 240, 0.4);
      color: #fff;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(139, 63, 240, 0.6);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(124, 92, 191, 0.3) 0%, rgba(74, 91, 208, 0.3) 100%);
      color: #c9a4ff;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 6px;
      transition: filter 0.3s, box-shadow 0.3s, border-color 0.3s;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.95), 0 0 22px rgba(0, 0, 0, 0.8);
    }

    button[type="submit"]:hover {
      filter: brightness(1.25);
      box-shadow: 0 0 18px rgba(139, 63, 240, 0.45);
      border-color: rgba(139, 63, 240, 1);
    }

    button[type="submit"]:active {
      transform: scale(0.985);
    }

    .message {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      display: block;
      background: rgba(192, 57, 43, 0.15);
      color: #ff8f80;
      border: 1px solid rgba(192, 57, 43, 0.4);
    }

    .message.success {
      display: block;
      background: rgba(46, 125, 50, 0.15);
      color: #7bd389;
      border: 1px solid rgba(46, 125, 50, 0.4);
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="stars"></div>
  <div class="moon"></div>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="cloud c5"></div>

  <div class="city">
    <div class="building b1"></div>
    <div class="building b2"><span class="antenna"></span></div>
    <div class="building b3"></div>
    <div class="building b4"></div>
    <div class="building b5"><span class="antenna"></span></div>
    <div class="building b6"></div>
    <div class="building b7"></div>
    <div class="building b8"></div>
    <div class="building b9"></div>
    <div class="building b10"><span class="antenna"></span></div>
    <div class="building b11"><span class="antenna"></span></div>
    <div class="building b12"></div>
    <div class="building b13"></div>
    <div class="building b14"><span class="antenna"></span></div>
    <div class="ground"></div>
    <div class="fog"></div>
  </div>

  <div class="card">
    <h1>NightData</h1>
    <div class="subtitle">// SECURE ACCESS TERMINAL</div>
    <div class="divider"></div>

    <div class="tabs">
      <button id="tab-login" class="active" onclick="showTab('login')">Anmelden</button>
      <button id="tab-register" onclick="showTab('register')">Konto erstellen</button>
    </div>

    <form id="login-form" class="form active" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-username">Benutzername</label>
        <input type="text" id="login-username" required minlength="3" autocomplete="username" placeholder="Benutzername">
      </div>
      <div class="form-group">
        <label for="login-password">Passwort</label>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="Dein Passwort">
      </div>
      <button type="submit">Anmelden</button>
      <div id="login-message" class="message"></div>
    </form>

    <form id="register-form" class="form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="register-username">Benutzername</label>
        <input type="text" id="register-username" required minlength="3" autocomplete="username" placeholder="Min. 3 Zeichen">
      </div>
      <div class="form-group">
        <label for="register-password">Passwort</label>
        <input type="password" id="register-password" required minlength="8" autocomplete="new-password" placeholder="Min. 8 Zeichen">
      </div>
      <div class="form-group">
        <label for="register-password2">Passwort wiederholen</label>
        <input type="password" id="register-password2" required placeholder="Passwort wiederholen">
      </div>
      <button type="submit">Konto erstellen</button>
      <div id="register-message" class="message"></div>
    </form>
  </div>

  <script>
    function showTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      document.getElementById('login-form').classList.toggle('active', tab === 'login');
      document.getElementById('register-form').classList.toggle('active', tab === 'register');
    }

    function showMessage(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'message ' + type;
    }

    // Backend-Adresse: leer lassen = gleiche Seite (z.B. beim lokalen Server).
    // Für GitHub Pages hier die Worker-URL des Backends eintragen, z.B.:
    // const https://dash.cloudflare.com/39eff8a925bb7871f8f7969db16696d1/workers/d1/databases/ee634b3f-26de-41a8-94d0-ad32123f24f4/metrics = 'https://nightdata-api.<subdomain>.workers.dev';
    const https://dash.cloudflare.com/39eff8a925bb7871f8f7969db16696d1/workers/d1/databases/ee634b3f-26de-41a8-94d0-ad32123f24f4/metrics = '';

    async function api(url, body) {
      try {
        const res = await fetch(API_BASE + url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        return await res.json();
      } catch (err) {
        return { error: 'Server nicht erreichbar. Prüfe die Backend-URL (API_BASE).' };
      }
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      const data = await api('/api/login', { username, password });

      if (data.success) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showMessage('login-message', 'Erfolgreich angemeldet als ' + escapeHtml(data.user.username) + '!', 'success');
        document.getElementById('login-password').value = '';
      } else {
        showMessage('login-message', data.error || 'Anmeldung fehlgeschlagen.', 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('register-username').value.trim();
      const password = document.getElementById('register-password').value;
      const password2 = document.getElementById('register-password2').value;

      if (password !== password2) {
        showMessage('register-message', 'Die Passwörter stimmen nicht überein.', 'error');
        return;
      }

      const data = await api('/api/register', { username, password });

      if (data.success) {
        showMessage('register-message', 'Konto erstellt! Du kannst dich jetzt anmelden.', 'success');
        document.getElementById('register-form').reset();
        showTab('login');
      } else {
        showMessage('register-message', data.error || 'Registrierung fehlgeschlagen.', 'error');
      }
    }
  </script>
</body>
</html>
